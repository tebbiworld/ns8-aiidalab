#
# Restic include patterns for the AiiDAlab module backup (paths relative to /srv).
# The home volume holds everything (AiiDA profile + PostgreSQL data, file
# repository, apps, notebooks, SSH key); state/aiidalab.sql is a consistent
# pg_dumpall taken right before the snapshot, for manual recovery if the raw
# database files were caught mid-write.
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
#
state/environment
state/aiidalab.env
state/aiidalab.sql
volumes/aiidalab-home
